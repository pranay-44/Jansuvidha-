<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thane bus stops — OSM research map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:16px system-ui;color:#183c32;background:#f5f7f5}header{padding:16px 20px}h1{font-size:24px;margin:0 0 8px}p{margin:8px 0}select{font:inherit;max-width:100%;padding:8px}#map{height:70vh;min-height:360px}.legend{display:flex;gap:20px;flex-wrap:wrap}.highway{color:#b45309}.local{color:#2563eb}.leaflet-popup-content{font-size:14px;line-height:1.5;max-height:350px;overflow:auto}.note{color:#52645d;font-size:14px}</style></head><body><header><h1>Thane bus stops</h1><p id="count" role="status"></p><div class="legend"><span class="highway">● Near trunk / primary roads</span><span class="local">● Other stops</span></div><p class="note">OpenStreetMap research coverage within the configured bounding box, not a complete official stop inventory. Headings and road-based addresses are estimates. Opposite directions remain separate. Tiles and Leaflet need internet.</p></header><div id="map" aria-label="Bus stop map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const data=__GEOJSON__;
const map=L.map('map').setView([19.23,72.98],12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a> · ODbL'}).addTo(map);
const layer=L.layerGroup().addTo(map);
function paragraph(container,label,value){const p=document.createElement('p'),b=document.createElement('strong');b.textContent=label+': ';p.append(b,document.createTextNode(value));container.append(p);}
function render(){layer.clearLayers();const found=data.features;for(const f of found){const p=f.properties,body=document.createElement('section'),h=document.createElement('h2');h.textContent=p.name||'Unnamed bus stop';body.append(h);paragraph(body,'Address',p.address);paragraph(body,'Direction',p.heading+(p.heading_source==='unknown'?'':' (estimated)'));paragraph(body,'Road',p.road||'Road not known yet');const a=document.createElement('a');a.href=p.source_url;a.textContent='View OSM source';a.target='_blank';a.rel='noopener';body.append(a);L.circleMarker([f.geometry.coordinates[1],f.geometry.coordinates[0]],{radius:7,color:p.on_highway?'#b45309':'#2563eb',fillOpacity:.8}).bindPopup(body).addTo(layer);}document.querySelector('#count').textContent=found.length+' bus stops shown';if(found.length)map.fitBounds(L.latLngBounds(found.map(f=>[f.geometry.coordinates[1],f.geometry.coordinates[0]])),{padding:[24,24],maxZoom:16});}
render();
</script></body></html>
